services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: resolver
      POSTGRES_PASSWORD: resolver
      POSTGRES_DB: resolver
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolver -d resolver"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
