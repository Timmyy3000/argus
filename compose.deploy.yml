name: argus

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resolver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resolver}
      POSTGRES_DB: ${POSTGRES_DB:-resolver}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-resolver} -d $${POSTGRES_DB:-resolver}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://resolver:resolver@postgres:5432/resolver}
    command: ["bun", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://resolver:resolver@postgres:5432/resolver}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARGUS_ENABLE_CODEX: ${ARGUS_ENABLE_CODEX:-false}
      ARGUS_ENABLE_TRIAGE: ${ARGUS_ENABLE_TRIAGE:-false}
      ARGUS_ENABLE_LLM_REVIEW: ${ARGUS_ENABLE_LLM_REVIEW:-false}
      ARGUS_ENABLE_GIT_PUSH: ${ARGUS_ENABLE_GIT_PUSH:-false}
      ARGUS_LLM_MODEL: ${ARGUS_LLM_MODEL:-gpt-5-mini}
      ARGUS_LLM_BASE_URL: ${ARGUS_LLM_BASE_URL:-https://api.openai.com/v1}
      ARGUS_MAX_DIFF_BYTES: ${ARGUS_MAX_DIFF_BYTES:-200000}
      ARGUS_WORKDIR: /app/.argus-work
      ARGUS_SANDBOX_MODE: ${ARGUS_SANDBOX_MODE:-host}
      ARGUS_SANDBOX_IMAGE: ${ARGUS_SANDBOX_IMAGE:-oven/bun:1}
      ARGUS_SANDBOX_NETWORK: ${ARGUS_SANDBOX_NETWORK:-bridge}
    ports:
      - "${PORT:-3000}:3000"
    command: ["bun", "run", "start"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/health'); if(!r.ok) process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://resolver:resolver@postgres:5432/resolver}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARGUS_ENABLE_CODEX: ${ARGUS_ENABLE_CODEX:-false}
      ARGUS_ENABLE_TRIAGE: ${ARGUS_ENABLE_TRIAGE:-false}
      ARGUS_ENABLE_LLM_REVIEW: ${ARGUS_ENABLE_LLM_REVIEW:-false}
      ARGUS_ENABLE_GIT_PUSH: ${ARGUS_ENABLE_GIT_PUSH:-false}
      ARGUS_LLM_MODEL: ${ARGUS_LLM_MODEL:-gpt-5-mini}
      ARGUS_LLM_BASE_URL: ${ARGUS_LLM_BASE_URL:-https://api.openai.com/v1}
      ARGUS_MAX_DIFF_BYTES: ${ARGUS_MAX_DIFF_BYTES:-200000}
      ARGUS_KEEP_WORKSPACE: ${ARGUS_KEEP_WORKSPACE:-false}
      ARGUS_WORKDIR: /app/.argus-work
      ARGUS_SANDBOX_MODE: ${ARGUS_SANDBOX_MODE:-host}
      ARGUS_SANDBOX_IMAGE: ${ARGUS_SANDBOX_IMAGE:-oven/bun:1}
      ARGUS_SANDBOX_NETWORK: ${ARGUS_SANDBOX_NETWORK:-bridge}
    command: ["bun", "run", "worker"]
    volumes:
      - argus_work:/app/.argus-work
      # Writable so Codex can rotate its subscription refresh token. Seed it
      # with the auth.json produced by `codex login` on a trusted machine.
      - codex_home:/root/.codex
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  argus_work:
  codex_home:
